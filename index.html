const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const DEF={mode:'deck',favor:false,cooldown:0,n:4,target:0,anim:true,theme:'dark'};
let S,hist=[],view='tirage',editing=null,q='',sort='count',showArch=false,spinning=false,banner='',msg='',exp='',impData=null,impMsg='',C={},L={};

function seed(){let sec='';const subs=[];RAW.split('\n').forEach(l=>{l=l.trim();if(!l)return;if(l[0]==='#')sec=l.slice(1);else subs.push({id:uid(),name:l,sec,base:0,arch:false});});return{subjects:subs,log:[],pending:[],deck:subs.map(s=>s.id),settings:{...DEF},backup:null};}
function valid(d){return !!d&&Array.isArray(d.subjects)&&Array.isArray(d.log)&&d.subjects.every(s=>s&&typeof s.id==='string'&&typeof s.name==='string'&&Number.isFinite(s.base))&&d.log.every(e=>e&&typeof e.sid==='string'&&Number.isFinite(e.ts));}
function norm(d){d.subjects.forEach(s=>{s.arch=!!s.arch;s.sec=s.sec||'';});d.log.forEach(e=>{e.id=e.id||uid();});d.pending=(d.pending||[]).filter(id=>d.subjects.some(s=>s.id===id));d.deck=Array.isArray(d.deck)?d.deck:d.subjects.map(s=>s.id);d.settings={...DEF,...(d.settings||{})};d.backup=d.backup||null;return d;}
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(valid(d))return norm(d);}}catch(e){}return seed();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){banner='Enregistrement impossible dans ce navigateur : les données seront perdues à la fermeture. Utilisez la sauvegarde dans Réglages.';}}
function derive(){C={};L={};S.log.forEach(e=>{C[e.sid]=(C[e.sid]||0)+1;if(!L[e.sid]||e.ts>L[e.sid])L[e.sid]=e.ts;});}
const cnt=s=>Math.max(0,s.base+(C[s.id]||0));
const byId=id=>S.subjects.find(s=>s.id===id);
const fois=n=>n===0?'Jamais étudiée':n===1?'Étudiée 1 fois':`Étudiée ${n} fois`;

function mut(fn,toast){hist.push(JSON.stringify(S));if(hist.length>50)hist.shift();fn();save();render();if(toast)showToast(toast);}
function undo(){if(!hist.length)return;S=JSON.parse(hist.pop());save();render();showToast('Action annulée.',false);}
let tt;function showToast(m,u=true){const t=$('#toast');t.innerHTML=`<span>${esc(m)}</span>`+(u&&hist.length?'<button data-act="undo">Annuler</button>':'');t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true;},6000);}

function elig(ex){const cd=S.settings.cooldown*864e5,now=Date.now();return S.subjects.filter(s=>!s.arch&&!ex.has(s.id)&&!(cd&&L[s.id]&&L[s.id]>now-cd));}
function weight(s){const c=cnt(s),t=S.settings.target;return t>0?Math.max(t-c,0)+0.15:1/(1+c);}
function draw(pool,k){const out=[];pool=pool.slice();while(out.length<k&&pool.length){const ws=S.settings.favor?pool.map(weight):pool.map(()=>1);let r=Math.random()*ws.reduce((a,b)=>a+b,0),i=0;for(;i<pool.length-1;i++){r-=ws[i];if(r<=0)break;}out.push(pool.splice(i,1)[0]);}return out;}

function doSpin(){
  S.pending.forEach(id=>{if(!S.deck.includes(id))S.deck.push(id);});
  const el=elig(new Set()),st=S.settings,k=Math.min(st.n,el.length);let picks;
  if(st.mode==='deck'){
    const d=new Set(S.deck),p=el.filter(s=>d.has(s.id));
    picks=draw(p,k);let wrapped=false;
    if(picks.length<k){wrapped=true;const got=new Set(picks.map(s=>s.id));picks=picks.concat(draw(el.filter(s=>!got.has(s.id)),k-picks.length));}
    const ids=new Set(picks.map(s=>s.id));
    S.deck=(wrapped?el.map(s=>s.id):S.deck).filter(i=>!ids.has(i));
  }else picks=draw(el,k);
  S.pending=picks.map(s=>s.id);
}
function spin(){
  if(spinning)return;derive();
  if(!elig(new Set()).length){showToast(S.subjects.some(s=>!s.arch)?'Toutes les matières sont en pause. Réduisez le délai dans Réglages.':'La liste est vide. Ajoutez des matières dans l’onglet Matières.',false);return;}
  const go=()=>{spinning=false;mut(doSpin);};
  if(S.settings.anim&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
    spinning=true;render();const names=S.subjects.filter(s=>!s.arch);let i=0;
    const iv=setInterval(()=>{document.querySelectorAll('.card.ph .t').forEach(e=>{e.textContent=names[Math.floor(Math.random()*names.length)].name;});if(++i>9){clearInterval(iv);go();}},80);
  }else go();
}
function done(id){mut(()=>{S.log.push({id:uid(),sid:id,ts:Date.now()});S.pending=S.pending.filter(x=>x!==id);},'Marqué comme étudié.');}
function reroll(id){
  derive();const el=elig(new Set(S.pending));
  if(!el.length){showToast('Aucune autre matière disponible.',false);return;}
  mut(()=>{const d=new Set(S.deck),p=el.filter(s=>d.has(s.id)),n=draw(p.length&&S.settings.mode==='deck'?p:el,1)[0],i=S.pending.indexOf(id);S.pending[i]=n.id;if(!S.deck.includes(id))S.deck.push(id);S.deck=S.deck.filter(x=>x!==n.id);});
}
function addSubs(){
  const t=$('#bulk').value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(!t.length){msg='Saisissez au moins une matière.';render();return;}
  const ex=new Set(S.subjects.map(s=>s.name.toLowerCase())),add=[];let dup=0;
  t.forEach(n=>{const k=n.toLowerCase();if(ex.has(k))dup++;else{ex.add(k);add.push({id:uid(),name:n,sec:'',base:0,arch:false});}});
  if(!add.length){msg=`Aucune ajoutée : ${dup} doublon(s).`;render();return;}
  msg=`${add.length} ajoutée(s)`+(dup?`, ${dup} doublon(s) ignoré(s).`:'.');
  mut(()=>{S.subjects.push(...add);S.deck.push(...add.map(s=>s.id));});
}
function rensave(id){const v=($('#ren').value||'').trim();editing=null;if(!v){render();return;}
  if(S.subjects.some(s=>s.id!==id&&s.name.toLowerCase()===v.toLowerCase())){msg='Ce nom existe déjà.';render();return;}
  mut(()=>{byId(id).name=v;});}
function gen(){S.backup=Date.now();save();exp=JSON.stringify({v:1,subjects:S.subjects,log:S.log,settings:S.settings});render();try{navigator.clipboard.writeText(exp).then(()=>showToast('Sauvegarde copiée.',false),()=>{});}catch(e){}}
function chk(){const t=$('#imp').value.trim();impData=null;
  if(!t)impMsg='Collez d’abord une sauvegarde.';
  else{try{const d=JSON.parse(t);if(!valid(d))throw 0;impData=d;impMsg=`Sauvegarde valide : ${d.subjects.length} matières, ${d.log.length} études enregistrées.`;}catch(e){impMsg='Sauvegarde invalide : rien n’a été modifié.';}}
  render();}
function impok(){const b=S.backup;mut(()=>{S=norm({subjects:impData.subjects,log:impData.log,settings:impData.settings,pending:[],deck:impData.subjects.map(s=>s.id)});S.backup=b;impData=null;impMsg='Données restaurées.';},'Données restaurées.');}

const row=s=>`<div class="r${s.arch?' ar':''}"><div class="rn">${editing===s.id?`<input id="ren" value="${esc(s.name)}" data-id="${s.id}" aria-label="Nom">`:esc(s.name)}</div><div class="ctl"><button data-act="minus" data-id="${s.id}" aria-label="Moins">−</button><input class="cn" type="number" min="0" inputmode="numeric" value="${cnt(s)}" data-id="${s.id}" aria-label="Nombre d’études"><button data-act="plus" data-id="${s.id}" aria-label="Plus">+</button><span class="sp"></span>${editing===s.id?`<button data-act="rensave" data-id="${s.id}">Enregistrer</button>`:`<button data-act="ren" data-id="${s.id}">Renommer</button>`}<button data-act="arch" data-id="${s.id}">${s.arch?'Restaurer':'Archiver'}</button></div></div>`;
function renderList(){
  const ql=q.trim().toLowerCase();
  let a=S.subjects.filter(s=>(showArch||!s.arch)&&(!ql||s.name.toLowerCase().includes(ql)));
  if(sort==='count')a=a.map((s,i)=>[s,i]).sort((x,y)=>cnt(x[0])-cnt(y[0])||x[1]-y[1]).map(x=>x[0]);
  $('#list').innerHTML=a.length?a.map(row).join(''):'<p class="empty">Aucune matière.</p>';
}
function vTirage(){
  const n=S.settings.n;
  if(spinning)return Array.from({length:Math.max(1,Math.min(n,elig(new Set()).length))},()=>'<article class="card ph"><div class="t">…</div></article>').join('');
  const ps=S.pending.map(byId).filter(Boolean);
  if(!ps.length)return `<p class="empty">Aucune matière tirée. Appuyez sur « Tirer au sort » pour en obtenir ${n}.</p>`;
  return ps.map(s=>`<article class="card"><div class="t">${esc(s.name)}</div>${s.sec?`<div class="m">${esc(s.sec)}</div>`:''}<div class="m">${fois(cnt(s))}</div><div class="row"><button class="pri" data-act="done" data-id="${s.id}">Étudié ✓</button><button data-act="re" data-id="${s.id}">Remplacer</button></div></article>`).join('');
}
function vMat(){
  return `<section><label class="lb" for="bulk">Ajouter des matières (une par ligne)</label><textarea id="bulk" rows="3"></textarea><button class="pri" data-act="cadd">Ajouter</button><p class="mu">${esc(msg)}</p></section>
<div class="tools"><input id="q" type="search" placeholder="Rechercher" value="${esc(q)}" aria-label="Rechercher"><select id="sort" aria-label="Tri"><option value="count"${sort==='count'?' selected':''}>Moins étudiées d’abord</option><option value="prog"${sort==='prog'?' selected':''}>Ordre du programme</option></select></div>
<label class="chk"><input type="checkbox" id="arch"${showArch?' checked':''}> Afficher les matières archivées</label><div id="list"></div>`;
}
function vHist(){
  const a=S.log.slice().sort((x,y)=>y.ts-x.ts);
  if(!a.length)return '<p class="empty">Aucune étude enregistrée pour le moment.</p>';
  return a.map(e=>{const s=byId(e.sid),d=new Date(e.ts);return `<div class="h"><div>${esc(s?s.name:'Matière supprimée')}<small>${d.toLocaleDateString('fr-FR')} à ${d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</small></div><button data-act="dlog" data-id="${e.id}">Supprimer</button></div>`;}).join('');
}
function vSet(){
  const s=S.settings,last=S.backup?'Dernière sauvegarde : '+new Date(S.backup).toLocaleDateString('fr-FR')+'.':'Aucune sauvegarde générée pour le moment.';
  return `<section class="set"><label>Mode de tirage<select data-set="mode"><option value="deck"${s.mode==='deck'?' selected':''}>Paquet mélangé (pas de répétition avant la fin du tour)</option><option value="random"${s.mode==='random'?' selected':''}>Aléatoire pur</option></select></label>
<label class="chk"><input type="checkbox" data-set="favor"${s.favor?' checked':''}> Favoriser les moins étudiées</label>
<label>Matières par tirage<input type="number" min="1" max="10" data-set="n" value="${s.n}"></label>
<label>Pause après une étude, en jours (0 = désactivée)<input type="number" min="0" data-set="cooldown" value="${s.cooldown}"></label>
<label>Objectif d’études par matière (0 = aucun)<input type="number" min="0" data-set="target" value="${s.target}"></label>
<label class="chk"><input type="checkbox" data-set="anim"${s.anim?' checked':''}> Animation du tirage</label>
<label>Thème<select data-set="theme"><option value="dark"${s.theme==='dark'?' selected':''}>Sombre</option><option value="light"${s.theme==='light'?' selected':''}>Clair</option></select></label></section>
<section><h2>Sauvegarde</h2><p class="mu">Les données sont stockées dans ce navigateur. Copiez la sauvegarde pour la conserver ou la transférer vers un autre appareil.</p>
<button data-act="gen">Générer la sauvegarde</button><textarea id="exp" readonly rows="3" aria-label="Sauvegarde">${esc(exp)}</textarea><p class="mu">${last}</p>
<label class="lb" for="imp">Restaurer depuis une sauvegarde</label><textarea id="imp" rows="3" placeholder="Collez ici le texte de la sauvegarde"></textarea><button data-act="imp">Vérifier</button><p class="mu">${esc(impMsg)}</p>${impData?'<div class="row"><button class="pri" data-act="impok">Remplacer mes données</button><button data-act="impno">Annuler</button></div>':''}</section>`;
}
function render(){
  derive();document.documentElement.dataset.theme=S.settings.theme;
  const tot=S.subjects.filter(s=>!s.arch),dn=tot.filter(s=>cnt(s)>0).length;
  $('#cov').textContent=`${dn} sur ${tot.length} matières étudiées au moins une fois`;
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===view)));
  $('#bar').hidden=view!=='tirage';$('#spin').disabled=spinning;
  $('#banner').hidden=!banner;$('#banner').textContent=banner;
  $('#app').innerHTML=({tirage:vTirage,matieres:vMat,historique:vHist,reglages:vSet})[view]();
  if(view==='matieres')renderList();
  if(editing){const i=$('#ren');if(i){i.focus();i.select();}}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const id=b.dataset.id,s=id&&byId(id);
  const A={
    tab:()=>{view=b.dataset.v;editing=null;msg='';render();window.scrollTo(0,0);},
    spin,undo,done:()=>done(id),re:()=>reroll(id),cadd:addSubs,gen,imp:chk,
    minus:()=>{if(s&&cnt(s)>0)mut(()=>{s.base-=1;});},
    plus:()=>{if(s)mut(()=>{s.base+=1;});},
    arch:()=>{if(s)mut(()=>{s.arch=!s.arch;S.pending=S.pending.filter(x=>x!==id);if(!s.arch&&!S.deck.includes(id))S.deck.push(id);});},
    ren:()=>{editing=id;render();},
    rensave:()=>rensave(id),
    dlog:()=>mut(()=>{S.log=S.log.filter(x=>x.id!==id);},'Entrée supprimée.'),
    impok,impno:()=>{impData=null;impMsg='';render();}
  };
  if(A[b.dataset.act])A[b.dataset.act]();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.set){const k=t.dataset.set;let v;
    if(t.type==='checkbox')v=t.checked;
    else if(t.type==='number')v=Math.max(+t.min||0,Math.min(+t.max||999,Math.floor(+t.value)||0));
    else v=t.value;
    S.settings[k]=v;save();render();return;}
  if(t.classList.contains('cn')){const v=Math.floor(+t.value),s=byId(t.dataset.id);
    if(!s||!(v>=0)){render();return;}
    mut(()=>{s.base=v-(C[s.id]||0);});return;}
  if(t.id==='sort'){sort=t.value;render();}
  if(t.id==='arch'){showArch=t.checked;render();}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;renderList();}});
document.addEventListener('keydown',e=>{
  if(e.target.id==='ren'){if(e.key==='Enter')rensave(e.target.dataset.id);if(e.key==='Escape'){editing=null;render();}}
});
S=load();save();render();
})();
</script>
</body>
</html>
